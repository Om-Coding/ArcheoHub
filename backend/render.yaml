services:
  - type: web
    name: archaeology-data-hub-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_API_BASE_URL
        fromService:
          name: archaeology-data-hub-frontend
          type: web
          property: url
